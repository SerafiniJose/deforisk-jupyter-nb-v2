name: spatial-risk
channels:
  - rapidsai
  - conda-forge
dependencies:
  # interpreter / build tooling
  - python=3.11.10
  - pip
  - setuptools>=80.9.0
  - wheel>=0.45.1

  # RAPIDS GPU stack (CUDA 12 only for 25.08)
  - rapidsai::cudf=25.08
  - rapidsai::cuml=25.08
  - rapidsai::dask-cuda=25.08
  - cuda-version=12.9

  # numpy kept at project pin (RAPIDS allows <3)
  - numpy=2.2

  # geospatial core  (gdal + rasterio UNPINNED -> conda-forge picks numpy-2 builds)
  - gdal
  - rasterio
  - fiona>=1.10.1
  - geopandas>=1.1.1
  - shapely>=2.0
  - pyproj>=3.7
  - rioxarray>=0.18.2
  - odc-geo>=0.4.10
  - xarray-spatial>=0.4.0          # import name: xrspatial

  # earth engine helpers (earthengine-api itself comes from the pip fork below)
  - geedim>=2.0.0
  - pycrs>=1.0.2
  - python-box>=7.3.2

  # modeling / data
  - dask-ml>=2025.1.0
  - scikit-learn>=1.6.1,<1.7   # cuml 25.08 needs BaseEstimator._get_default_requests (removed in sklearn 1.7+)
  - patsy
  - matplotlib
  - formulaic>=1.2.1
  - pydantic>=2.12.2

  # jupyter
  - ipykernel=6.30.1
  - jupyterlab
  - notebook

  # geemap runtime deps (geemap itself is pip --no-deps to preserve the EE fork,
  # so its UI deps must be supplied here; earthengine-api intentionally omitted)
  - anywidget
  - bqplot
  - colour
  - eerepr
  - folium
  - geocoder
  - ipecharts>=1.4,<2
  - ipyevents
  - ipyfilechooser
  - ipyleaflet
  - ipytree
  # plotly is a geemap runtime dependency ONLY. It is no longer the Evaluation
  # tile's chart backend — those charts render through ipecharts (above), and
  # tests/test_evaluation.py::test_evaluation_gui_path_imports_no_plotly keeps
  # the Evaluation import graph plotly-free.
  - plotly
  - pyperclip
  - pyshp
  - scooby

  # pip deps that resolve normally (fork + geefcc's pip-only deps)
  - pip:
    - "git+https://github.com/openforis/earthengine-api.git@v1.1.5rc0#subdirectory=python"
    - xee
    - multiprocess
