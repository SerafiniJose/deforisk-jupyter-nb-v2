version = 1
disable_existing_loggers = false

# ─── FORMATTERS ──────────────────────────────────────────────
[formatters.colored_spatial_risk]
"()"   = "colorlog.ColoredFormatter"
format = "%(log_color)s%(asctime)s - \u001b[44m%(name)s\u001b[0m - %(levelname)s - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[formatters.colored_spatial_risk.log_colors]
DEBUG    = "cyan"
INFO     = "green"
WARNING  = "yellow"
ERROR    = "red"
CRITICAL = "bold_red"


# ─── HANDLERS ────────────────────────────────────────────────

[handlers.file]
class     = "logging.FileHandler"
level     = "DEBUG"
formatter = "colored_spatial_risk"
filename  = "spatial_risk.log"
mode      = "w"

[handlers.console]
class     = "logging.StreamHandler"
level     = "DEBUG"
formatter = "colored_spatial_risk"
stream    = "ext://sys.stderr"


# ─── LOGGERS ────────────────────────────────────────────────

[loggers.spatial_risk]
level     = "DEBUG"
handlers  = ["console", "file"]
propagate = false


# ─── ROOT ───────────────────────────────────────────────────
[root]
level    = "WARNING"
handlers = []
