[project]
name = "deforisk-jupyter-nb"
version = "0.1.0"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "dask-ml>=2025.1.0",
    "earthengine-api",
    "fiona>=1.10.1",
    "forestatrisk>=1.3.2",
    "formulaic>=1.2.1",
    "gdal[numpy]==3.8.4",
    "geedim>=2.0.0",
    "geemap==0.36.0",
    "geopandas>=1.1.1",
    "ipykernel==6.30.1",
    "numpy==2.2",
    "odc-geo>=0.4.10",
    "pip>=25.2",
    "pycrs>=1.0.2",
    "pydantic>=2.12.2",
    "python-box>=7.3.2",
    "rasterio<1.3.11",
    "rioxarray>=0.18.2",
    "riskmapjnr>=1.3.2",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
    "xarray-spatial>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]  
include = ["component*"]  
exclude = ["notebooks*", "notebooks_dask*", "data*", "docs*", "legacy*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "ui: mounts components through reacton/solara (needs the i18n warm-up + rc.close discipline)",
    "raster: writes real GeoTIFFs; needs rasterio/geopandas",
    "tippecanoe: needs the tippecanoe binary on PATH",
    "slow: >2s wall clock",
]
filterwarnings = [
    # Scoped by message+module: `LocalRasterVar path does not exist` is a real
    # signal in tests that are *not* deliberately pointing at absent paths.
    "ignore:LocalRasterVar path does not exist.*:UserWarning",
    "ignore:LocalVectorVar path does not exist.*:UserWarning",
    "ignore::FutureWarning:rioxarray.*",
]

[tool.ruff]
select = ["E", "F", "W", "I", "D", "RUF"]
exclude = [".venv"]
ignore = ["D200","D212"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F403"] # unable to detect undefined names | hide internal structure
"setup.py" = ["D100"] # nothing to see there

[tool.codespell]
# Real Spanish, French and Portuguese words in the message catalogues that
# codespell's English dictionary misreads as typos of similarly-spelled English
# words (e.g. pt "nome" -> "gnome", fr "ans" -> "and", es "termine" ->
# "determine"). Extend this when adding a locale, after checking each hit is a
# genuine word and not a real typo.
ignore-words-list = "absolue,absorve,alignement,ans,anual,approche,attendent,bloc,bord,celles,clases,classe,complet,conter,convient,eles,erro,espaces,existant,explicite,fixe,fonction,formule,formules,gere,hace,initiales,itens,limite,medias,momento,nome,persistant,posible,projet,projets,relie,requiere,ressource,ser,somme,termine,transforme,valide,vetor"
