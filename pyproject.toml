[project]
name = "deforisk-jupyter-nb"
version = "0.1.0"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # GPU / RAPIDS (CUDA 12)
    "cudf-cu12>=25.8.0",
    "cuml-cu12>=25.8.0",
    # Earth Engine — openforis SEPAL fork (satisfies pysepal>1.6.0)
    "earthengine-api @ git+https://github.com/openforis/earthengine-api.git@v1.6.14#subdirectory=python",
    "geedim>=2.0.0",
    # Geospatial binaries are provided by conda (sepal_environment.yml); keep
    # unpinned so the conda builds satisfy these instead of rebuilding from source.
    "gdal",
    "rasterio",
    "fiona>=1.10.1",
    "geopandas>=1.1.1",
    "rioxarray>=0.18.2",
    "numpy>=2.2",
    # Modeling / data
    "forestatrisk>=1.3.2",
    "riskmapjnr>=1.3.2",
    "formulaic>=1.2.1",
    "odc-geo>=0.4.10",
    "xarray-spatial>=0.4.0",
    "pycrs>=1.0.2",
    "python-box>=7.3.2",
    "pydantic>=2.12.2",
    # GUI / SEPAL
    "pysepal",
    "starlette<0.53",
    # Tooling
    "ipykernel>=6.30.1",
    "pip>=25.2",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[tool.setuptools.packages.find]
where = ["."]  
include = ["component*"]  
exclude = ["notebooks*", "notebooks_dask*", "data*", "docs*", "legacy*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
select = ["E", "F", "W", "I", "D", "RUF"]
exclude = [".venv"]
ignore = ["D200","D212"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F403"] # unable to detect undefined names | hide internal structure
"setup.py" = ["D100"] # nothing to see there
