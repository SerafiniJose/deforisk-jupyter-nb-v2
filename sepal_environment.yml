name: spatial-risk
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Geospatial binaries — conda handles these correctly
  - gdal
  - rasterio
  - fiona
  - geopandas
  - rioxarray
  # Scientific
  - numpy
  - pydantic
  # Utilities
  - ipykernel
  - setuptools
  - wheel
  - pip
  - pip:
    # Single source of truth for Python deps is pyproject.toml.
    # Installing the project pulls everything else (EE fork, geedim, forestatrisk,
    # riskmapjnr, odc-geo, xarray-spatial, pysepal, GPU stack, ...).
    - -e .
