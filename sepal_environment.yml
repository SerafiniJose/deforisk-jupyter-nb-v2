name: spatial-risk
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Geospatial binaries — conda handles these correctly
  - gdal
  - rasterio
  - fiona
  - geopandas
  - rioxarray
  - tippecanoe
  # Scientific
  - numpy
  - pydantic
  # Utilities
  - ipykernel
  - setuptools
  - wheel
  - pip
  - pip:
    # Earth Engine (custom build)
    - "earthengine-api @ git+https://github.com/openforis/earthengine-api.git@v1.1.5rc0#subdirectory=python"
    - geedim>=2.0.0
    - geemap==0.36.0
    # ML models
    - forestatrisk>=1.3.2
    - riskmapjnr>=1.3.2
    - formulaic>=1.2.1
    # Geospatial processing
    - odc-geo>=0.4.10
    - xarray-spatial>=0.4.0
    - pycrs>=1.0.2
    # Utilities
    - python-box>=7.3.2
    # GUI
    - "starlette<0.53"
    - pysepal
    - "pyvectortiles @ git+https://github.com/dfguerrerom/ipy-pmtiles"
    - pmtiles
    # Install this project (spatialrisk + gui packages)
    - -e .
